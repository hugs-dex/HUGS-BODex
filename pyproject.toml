[build-system]
requires = ["setuptools>=64", "wheel", "torch==2.2.2", "pybind11", "ninja"]

build-backend = "setuptools.build_meta"


[project]
name = "nvidia_curobo"
version = "0.1.0.dev0"
description = "GPU robot motion toolkit containing CUDA-accelerated kinematics, IK, MPC, global motion planning, and optimization solvers."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10,<3.11"
license = { file = "LICENSE" }
authors = [{ name = "NVIDIA Seattle Robotics Lab" }]
classifiers = [
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Robotics",
]
dependencies = [
    # Eigen headers for the Coal OpenMP wrapper, installed inside .venv.
    "cmeel-eigen==3.4.0.2",
    "hydra-core",
    "importlib_resources",
    "networkx",
    "numpy==1.26.4",
    "numpy-quaternion",
    "pybind11",
    "pyyaml",
    "scikit-image",
    "scipy>=1.7.0",
    "setuptools_scm>=6.2",
    "torch==2.2.2",
    "torch-scatter==2.1.2+pt22cu121",
    "tqdm",
    "transforms3d",
    "trimesh",
    "viser",
    "warp-lang>=0.9.0",
    "wheel",
    "yourdfpy>=0.0.53",
    "pytorch-kinematics",
    "mingrui-utils-python",
]

[project.optional-dependencies]
render = [
    "imageio",
    "pyglet<2",
    "pyrender",
]
human = [
    "chumpy==0.70",
    "opencv-python-headless==4.10.0.84",
]
dev = [
    "black",
    "flake8",
    "flake8-docstrings",
    "flake8-isort",
    "ipdb",
    "ipython",
    "pytest>6.2.5",
    "pytest-cov",
]
ci = [
    "anybadge",
    "black",
    "build",
    "furo",
    "graphviz>=0.20.1",
    "pytest>6.2.5",
    "pytest-cov",
    "sphinx",
    "sphinx-copybutton",
    "sphinx_rtd_theme",
    "twine",
]
doc = [
    "furo",
    "graphviz>=0.20.1",
    "sphinx",
    "sphinx-copybutton",
    "sphinx_rtd_theme",
]
isaacsim = [
    "ninja",
    "tomli",
    "wheel",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests", "*.build", "*.build.*"]


[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
pytorch-kinematics = { path = "third_party/pytorch_kinematics", editable = true }
mingrui-utils-python = { path = "third_party/utils_python", editable = true }

[tool.uv]
find-links = ["https://data.pyg.org/whl/torch-2.2.0+cu121.html"]


[tool.isort]
# see https://github.com/PyCQA/isort#multi-line-output-modes
multi_line_output = 2
import_heading_stdlib = "Standard Library"
import_heading_thirdparty = "Third Party"
import_heading_firstparty = "CuRobo"
import_heading_localfolder = "Local Folder"
import_heading_isaacgym = "Loading isaacgym before pytorch"
known_first_party = "CuRobo"
known_isaacgym = "isaacgym"
line_length = 100
sections = "FUTURE, STDLIB, ISAACGYM, THIRDPARTY, FIRSTPARTY, LOCALFOLDER"

[tool.pytest.ini_options]
norecursedirs = [".git", ".venv", "deprecated", "dist"]
python_files = ["*_test.py"]


#[tool.pylint.TYPECHECK]
# List of members which are set dynamically and missed by Pylint inference
# system, and so shouldn't trigger E1101 when accessed.
# generated-members=numpy.*, torch.*



[tool.coverage.report]
# NOTE: Single-quoted strings are required in TOML for regular expressions
exclude_lines = [
	"pragma: no cover", # Need to re-enable the standard no cover match
	'^\s*pass\s*$',  # Skip any pass lines
    "wp.kernel",
    "torch.jit.script",
    "abstractmethod",
    "def backward",
    "staticmethod\ndef forward",
]
omit = [
    "src/curobo/util/error_metrics.py",
    "src/curobo/rollout/cost/straight_line_cost.py",
    "src/curobo/rollout/cost/projected_dist_cost.py",
    "src/curobo/rollout/cost/manipulability_cost.py",
]

[tool.interrogate]
ignore-regex = ["forward", "backward"]

# https://black.readthedocs.io/en/stable/the_black_code_style/current_style.html
[tool.black]
line-length = 120
skip-magic-trailing-comma = false  # 保持默认
skip-string-normalization = false  # 保持默认
# 关键配置：让 Black 忽略注释长度
experimental-string-processing = false  # 禁用实验性字符串处理（可能影响注释换行）

# https://beta.ruff.rs/docs/settings/
[tool.ruff]
line-length = 120
# https://beta.ruff.rs/docs/rules/
select = ["E", "W", "F"]
ignore = ["F401"]
# Exclude a variety of commonly ignored directories.
respect-gitignore = true
ignore-init-module-imports = true
