    manip_cfg_file: sim_dual_dummy_arm_shadow/tabletop_three.yml
    object_scale_list:
    robot_group: dual_dummy_arm
    transfer_file: hand_pose_human_transfer/dual_dummy_arm_shadow.yaml
    transfer_links: [rh_palm, lh_palm]
    hand_indices: [0, 1]
    jitter:
      # translational_bounds_xyz: [[-0.01, 0.05, -0.01], [0.01, 0.06, 0.01]]
