name: issue89_random_shadow_seed40
baseline: multi_scale
robot_name: shadow
description: Issue #89 Surface Sample baseline with 40 solver seeds per active type.

requires:
  task:
    init_source: surface_sample
    scene_source:
      use_object_scale_list: true

overrides:
  suite:
    grasp_types:
      1_right_two:
        object_scale_list: [0.02, 0.03, 0.04]
      2_right_three:
        object_scale_list: [0.02, 0.03, 0.04, 0.06, 0.08]
      3_right_full:
        object_scale_list: [0.06, 0.08, 0.11, 0.13, 0.16, 0.19, 0.23]
      4_both_three:
        object_scale_list: [0.08, 0.11]
      5_both_full:
        object_scale_list: [0.11, 0.13, 0.16, 0.19, 0.23, 0.26, 0.30]

  manip:
    sim_shadow/tabletop_two.yml:
      seed_num: 40
    sim_shadow/tabletop_three.yml:
      seed_num: 40
    sim_shadow/tabletop_full.yml:
      seed_num: 40
    sim_dual_dummy_arm_shadow/tabletop_three.yml:
      seed_num: 40
      seeder_cfg:
        sampling_mode: random_xy_symmetric
    sim_dual_dummy_arm_shadow/tabletop_full.yml:
      seed_num: 40
      seeder_cfg:
        sampling_mode: random_xy_symmetric
